<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>JARVIS</title>
<link rel="stylesheet" href="/css/hud.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='none' stroke='%2338e1ff' stroke-width='6'/><circle cx='50' cy='50' r='12' fill='%2338e1ff'/></svg>" />
</head>
<body data-state="idle">

  <!-- the neural core, full-bleed behind everything -->
  <canvas id="brain-canvas"></canvas>
  <canvas id="hud-canvas"></canvas>
  <div class="vignette"></div>

  <!-- top bar -->
  <header class="hud-bar">
    <div class="brand">
      <span id="state-dot" class="dot" data-state="idle"></span>
      <span class="wordmark">J A R V I S</span>
      <span class="sub">just a rather very intelligent system</span>
    </div>
    <div class="readouts">
      <span class="readout"><b id="state-label">IDLE</b></span>
      <span class="readout"><i>core</i><b id="stat-model">—</b></span>
      <span class="readout"><i>latency</i><b id="stat-latency">—</b></span>
      <span class="readout"><i>throughput</i><b id="stat-rate">—</b></span>
      <span class="readout"><i>tokens</i><b id="stat-tokens">—</b></span>
      <span class="readout"><i>render</i><b id="stat-fps">—</b></span>
      <span class="readout"><i>neurons·synapses</i><b id="stat-neurons">—</b></span>
    </div>
  </header>

  <!-- left column -->
  <aside class="panel-column left">
    <section class="panel">
      <h2>System Vitals</h2>
      <div id="vitals" class="vitals"></div>
    </section>

    <section class="panel grow">
      <h2>Cognition Stream <span id="mood-label" class="tag">CALM</span></h2>
      <div id="thought-stream" class="stream thoughts"></div>
    </section>

    <section class="panel">
      <h2>Active Objectives</h2>
      <div id="goal-list" class="goals"></div>
    </section>
  </aside>

  <!-- right column: tabbed, so the assistant's other jobs each get room -->
  <aside class="panel-column right">
    <section class="panel grow tabbed">
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="inbox" role="tab">
          INBOX <span id="inbox-badge" class="badge"></span>
        </button>
        <button class="tab" data-tab="work" role="tab">
          WORK <span id="work-badge" class="badge"></span>
        </button>
        <button class="tab" data-tab="ventures" role="tab">VENTURES</button>
        <button class="tab" data-tab="life" role="tab">
          LIFE <span id="life-badge" class="badge"></span>
        </button>
        <button class="tab" data-tab="tools" role="tab">TOOLS</button>
        <button class="tab" data-tab="memory" role="tab">MEM</button>
      </nav>

      <div class="tab-panel active" data-panel="inbox">
        <div id="email-status" class="panel-note"></div>
        <div id="draft-list" class="drafts"></div>
        <div id="inbox-list" class="stream inbox"></div>
      </div>

      <div class="tab-panel" data-panel="work">
        <div id="work-now" class="panel-note"></div>
        <div id="work-list" class="stream work"></div>
      </div>

      <div class="tab-panel" data-panel="ventures">
        <div id="venture-list" class="stream ventures"></div>
      </div>

      <div class="tab-panel" data-panel="life">
        <div id="activity-now" class="panel-note"></div>
        <div id="time-bars" class="time-bars"></div>
        <h3 class="sub-head">WHAT I'VE LEARNED ABOUT YOU</h3>
        <div id="insight-list" class="stream insights"></div>
      </div>

      <div class="tab-panel" data-panel="tools">
        <div id="tool-trace" class="stream tools"></div>
      </div>

      <div class="tab-panel" data-panel="memory">
        <div id="memory-stream" class="stream memory"></div>
      </div>
    </section>
  </aside>

  <!-- conversation + composer -->
  <main class="console">
    <div id="transcript" class="transcript"></div>
    <div id="interim" class="interim"></div>
    <div class="composer">
      <button id="mic-button" class="icon-button" title="Toggle microphone (Space)">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"
                fill="currentColor"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span id="mic-label">MIC OFF</span>
      </button>

      <input id="composer-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Speak, or type a command…" />

      <button id="composer-send" class="send-button" title="Send">SEND</button>

      <button id="speaker-button" class="icon-button" title="Voice output active">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <button id="voice-settings" class="icon-button" title="Choose the voice">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M4 14h2V10H4zM9 18h2V6H9zM14 15h2V9h-2zM19 12.5h2v-1h-2z"
                fill="currentColor"/>
        </svg>
        <span>VOICE</span>
      </button>

      <label class="wake-toggle" title="Require the wake word before acting">
        <input id="wake-toggle" type="checkbox" />
        <span>WAKE WORD</span>
      </label>
    </div>

    <!-- voice picker, anchored above the composer -->
    <div id="voice-panel" class="voice-panel">
      <div class="voice-row">
        <label for="voice-select">VOICE</label>
        <select id="voice-select"></select>
      </div>
      <div class="voice-row">
        <label for="voice-rate">SPEED</label>
        <input id="voice-rate" type="range" min="0.6" max="1.6" step="0.02" />
        <output id="voice-rate-value"></output>
      </div>
      <div class="voice-row">
        <label for="voice-pitch">PITCH</label>
        <input id="voice-pitch" type="range" min="0.5" max="1.5" step="0.02" />
        <output id="voice-pitch-value"></output>
      </div>
      <div class="voice-actions">
        <button id="voice-test">TEST</button>
        <button id="voice-reset">RESET</button>
        <button id="voice-close">DONE</button>
      </div>
      <div id="voice-hint" class="voice-hint"></div>
    </div>
  </main>

  <!-- morning briefing / proactive report overlay -->
  <div id="briefing" class="briefing">
    <div class="briefing-head">
      <span>BRIEFING</span>
      <button id="briefing-close" class="briefing-close" title="Dismiss">×</button>
    </div>
    <div id="briefing-body" class="briefing-body"></div>
  </div>

  <!-- the nudge: a helix that surfaces, says one thing, and goes away -->
  <div id="nudge" class="nudge" role="alert" aria-live="polite">
    <canvas id="nudge-helix" class="nudge-helix" width="72" height="120"></canvas>
    <div class="nudge-body">
      <div class="nudge-head">
        <span id="nudge-kind" class="nudge-kind">JARVIS</span>
        <button id="nudge-close" class="nudge-close" title="Dismiss">×</button>
      </div>
      <div id="nudge-text" class="nudge-text"></div>
      <div class="nudge-actions">
        <button id="nudge-ok" class="nudge-ok">GOT IT</button>
        <button id="nudge-bad" class="nudge-bad">NOT HELPFUL</button>
        <button id="nudge-snooze" class="nudge-snooze">SNOOZE 1H</button>
      </div>
    </div>
  </div>

  <div id="banner" class="banner"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
