<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>JARVIS</title>
<link rel="stylesheet" href="/css/hud.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='none' stroke='%2338e1ff' stroke-width='6'/><circle cx='50' cy='50' r='12' fill='%2338e1ff'/></svg>" />
</head>
<body data-state="idle">

  <!-- the neural core, full-bleed behind everything -->
  <canvas id="brain-canvas"></canvas>
  <canvas id="hud-canvas"></canvas>
  <div class="vignette"></div>

  <!-- ─────────────────────────────────────────────── top bar ── -->
  <header class="topbar">
    <div class="identity">
      <span id="state-dot" class="dot" data-state="idle"></span>
      <span class="wordmark">JARVIS</span>
      <span id="state-label" class="state-chip">IDLE</span>
    </div>

    <button id="palette-open" class="omni" title="Command palette">
      <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M16 16l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Search memory, run anything…</span>
      <kbd>⌘K</kbd>
    </button>

    <div class="meters">
      <span class="meter" title="Reasoning core">
        <i>core</i><b id="stat-model">—</b>
      </span>
      <span class="meter" title="Time to first token">
        <i>latency</i><b id="stat-latency">—</b>
      </span>
      <span class="meter" title="Tokens per second">
        <i>rate</i><b id="stat-rate">—</b>
      </span>
      <span class="meter" title="Tokens used this session">
        <i>tokens</i><b id="stat-tokens">—</b>
      </span>
      <span class="meter" title="Render performance">
        <i>render</i><b id="stat-fps">—</b>
      </span>
      <button id="focus-toggle" class="ghost-button" title="Focus mode — hide the panels (F)">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ─────────────────────────────────────────────── icon rail ── -->
  <nav class="rail" role="tablist" aria-label="Panels">
    <button class="rail-btn active" data-view="today" title="Today (1)" role="tab">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="15" rx="2.5" fill="none"
              stroke="currentColor" stroke-width="1.8"/>
        <path d="M3.5 9.5h17M8 3.5v3M16 3.5v3" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="rail-label">TODAY</span>
      <i id="badge-today" class="rail-badge"></i>
    </button>

    <button class="rail-btn" data-view="mind" title="Mind (2)" role="tab">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <path d="M12 4.5a3.2 3.2 0 0 0-3.2 3.2A3 3 0 0 0 6.5 13a3 3 0 0 0 2 2.8
                 A3 3 0 0 0 12 19.5a3 3 0 0 0 3.5-3.7 3 3 0 0 0 2-2.8
                 3 3 0 0 0-2.3-5.3A3.2 3.2 0 0 0 12 4.5z"
              fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 4.5v15" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
      </svg>
      <span class="rail-label">MIND</span>
    </button>

    <button class="rail-btn" data-view="inbox" title="Inbox (3)" role="tab">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <path d="M3.5 6.5h17v11h-17z" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3.5 7l8.5 6 8.5-6" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      <span class="rail-label">INBOX</span>
      <i id="badge-inbox" class="rail-badge"></i>
    </button>

    <button class="rail-btn" data-view="work" title="Work (4)" role="tab">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <rect x="3.5" y="7.5" width="17" height="12" rx="2" fill="none"
              stroke="currentColor" stroke-width="1.8"/>
        <path d="M9 7.5V5.5h6v2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </svg>
      <span class="rail-label">WORK</span>
      <i id="badge-work" class="rail-badge"></i>
    </button>

    <button class="rail-btn" data-view="life" title="Life (5)" role="tab">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 7v5.4l3.4 2" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="rail-label">LIFE</span>
      <i id="badge-life" class="rail-badge"></i>
    </button>

    <button class="rail-btn" data-view="ventures" title="Ventures (6)" role="tab">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <path d="M4 16.5l4.8-5.2 3.4 3 6.8-7.3" fill="none" stroke="currentColor"
              stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 7h4v4" fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="rail-label">VENTURE</span>
    </button>

    <button class="rail-btn" data-view="memory" title="Memory (7)" role="tab">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <rect x="4.5" y="4.5" width="15" height="15" rx="2.5" fill="none"
              stroke="currentColor" stroke-width="1.8"/>
        <path d="M8.5 9h7M8.5 12h7M8.5 15h4" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span class="rail-label">MEMORY</span>
    </button>

    <div class="rail-spacer"></div>

    <button class="rail-btn" data-view="system" title="System (8)" role="tab">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"
              stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span class="rail-label">SYSTEM</span>
      <i id="badge-system" class="rail-badge"></i>
    </button>
  </nav>

  <!-- ─────────────────────────────────────────── contextual panel ── -->
  <aside id="dock" class="dock">
    <header class="dock-head">
      <h2 id="dock-title">TODAY</h2>
      <div id="dock-actions" class="dock-actions"></div>
    </header>

    <!-- TODAY -->
    <section class="view active" data-view="today">
      <div id="today-hero" class="hero"></div>
      <div id="today-time" class="time-bars"></div>
      <h3 class="sub-head">NEEDS YOU</h3>
      <div id="today-attention" class="stream compact"></div>
      <h3 class="sub-head">NOTICED</h3>
      <div id="today-noticed" class="stream compact"></div>
    </section>

    <!-- MIND -->
    <section class="view" data-view="mind">
      <div class="mood-strip">
        <span>MOOD</span><b id="mood-label">CALM</b>
        <button id="tick-now" class="mini-button" title="Force a reflection pass now">
          REFLECT NOW
        </button>
      </div>
      <div id="thought-stream" class="stream thoughts grow"></div>
      <h3 class="sub-head">TOOL TRACE</h3>
      <div id="tool-trace" class="stream tools"></div>
    </section>

    <!-- INBOX -->
    <section class="view" data-view="inbox">
      <div id="email-status" class="panel-note"></div>
      <div id="draft-list" class="drafts"></div>
      <div id="inbox-list" class="stream inbox grow"></div>
    </section>

    <!-- WORK -->
    <section class="view" data-view="work">
      <div id="work-now" class="panel-note"></div>
      <form id="work-form" class="inline-form">
        <input id="work-input" type="text" placeholder="Give it something to work on…"
               autocomplete="off" />
        <button type="submit" class="mini-button">QUEUE</button>
      </form>
      <div id="work-list" class="stream work grow"></div>
    </section>

    <!-- LIFE -->
    <section class="view" data-view="life">
      <div id="activity-now" class="panel-note"></div>
      <div id="time-bars" class="time-bars"></div>
      <h3 class="sub-head">
        WHAT I'VE LEARNED ABOUT YOU
        <button id="mine-now" class="mini-button" title="Run a learning pass now">
          LEARN NOW
        </button>
      </h3>
      <div id="insight-list" class="stream insights grow"></div>
    </section>

    <!-- VENTURES -->
    <section class="view" data-view="ventures">
      <div id="venture-list" class="stream ventures grow"></div>
    </section>

    <!-- MEMORY -->
    <section class="view" data-view="memory">
      <form id="recall-form" class="inline-form">
        <input id="recall-input" type="text" placeholder="Search everything it remembers…"
               autocomplete="off" />
        <button type="submit" class="mini-button">FIND</button>
      </form>
      <form id="capture-form" class="inline-form">
        <input id="capture-input" type="text" placeholder="Remember this…"
               autocomplete="off" />
        <button type="submit" class="mini-button">STORE</button>
      </form>
      <div id="recall-results" class="stream memory grow"></div>
      <h3 class="sub-head">OBJECTIVES</h3>
      <form id="goal-form" class="inline-form">
        <input id="goal-input" type="text" placeholder="New objective…" autocomplete="off" />
        <button type="submit" class="mini-button">SET</button>
      </form>
      <div id="goal-list" class="goals"></div>
    </section>

    <!-- SYSTEM -->
    <section class="view" data-view="system">
      <div id="backend-card" class="card"></div>
      <h3 class="sub-head">HOST</h3>
      <div id="vitals" class="vitals"></div>
      <h3 class="sub-head">VOICE</h3>
      <div class="voice-row">
        <label for="voice-select">VOICE</label>
        <select id="voice-select"></select>
      </div>
      <div class="voice-row">
        <label for="voice-rate">SPEED</label>
        <input id="voice-rate" type="range" min="0.6" max="1.6" step="0.02" />
        <output id="voice-rate-value"></output>
      </div>
      <div class="voice-row">
        <label for="voice-pitch">PITCH</label>
        <input id="voice-pitch" type="range" min="0.5" max="1.5" step="0.02" />
        <output id="voice-pitch-value"></output>
      </div>
      <div class="voice-actions">
        <button id="voice-test" class="mini-button">TEST</button>
        <button id="voice-reset" class="mini-button">RESET</button>
      </div>
      <div id="voice-hint" class="voice-hint"></div>
      <h3 class="sub-head">EVENT LOG</h3>
      <div id="memory-stream" class="stream memory"></div>
    </section>
  </aside>

  <!-- ─────────────────────────────────────────────── conversation ── -->
  <main class="console">
    <div id="transcript" class="transcript"></div>
    <div id="interim" class="interim"></div>

    <div id="suggestions" class="suggestions"></div>

    <div class="composer">
      <button id="mic-button" class="icon-button" title="Toggle microphone (Space)">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"
                fill="currentColor"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span id="mic-label">MIC OFF</span>
      </button>

      <input id="composer-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Speak, or type a command…" />

      <button id="composer-send" class="send-button" title="Send">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <path d="M4 12h14M12 6l6 6-6 6" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button id="speaker-button" class="icon-button slim" title="Voice output active">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <label class="wake-toggle" title="Require the wake word before acting">
        <input id="wake-toggle" type="checkbox" />
        <span>WAKE</span>
      </label>
    </div>
  </main>

  <!-- ────────────────────────────────────────── command palette ── -->
  <div id="palette" class="palette" role="dialog" aria-label="Command palette">
    <div class="palette-box">
      <input id="palette-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Run a command, or type to search memory…" />
      <div id="palette-list" class="palette-list"></div>
      <div class="palette-foot">
        <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>↵</kbd> run · <kbd>esc</kbd> close
      </div>
    </div>
  </div>

  <!-- morning briefing / news overlay -->
  <div id="briefing" class="briefing">
    <div class="briefing-head">
      <span id="briefing-title">BRIEFING</span>
      <button id="briefing-close" class="briefing-close" title="Dismiss">×</button>
    </div>
    <div id="briefing-body" class="briefing-body"></div>
  </div>

  <!-- the nudge: a helix that surfaces, says one thing, and goes away -->
  <div id="nudge" class="nudge" role="alert" aria-live="polite">
    <canvas id="nudge-helix" class="nudge-helix" width="72" height="120"></canvas>
    <div class="nudge-body">
      <div class="nudge-head">
        <span id="nudge-kind" class="nudge-kind">JARVIS</span>
        <button id="nudge-close" class="nudge-close" title="Dismiss">×</button>
      </div>
      <div id="nudge-text" class="nudge-text"></div>
      <div class="nudge-actions">
        <button id="nudge-ok" class="nudge-ok">GOT IT</button>
        <button id="nudge-bad" class="nudge-bad">NOT HELPFUL</button>
        <button id="nudge-snooze" class="nudge-snooze">SNOOZE 1H</button>
      </div>
    </div>
  </div>

  <div id="banner" class="banner"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
