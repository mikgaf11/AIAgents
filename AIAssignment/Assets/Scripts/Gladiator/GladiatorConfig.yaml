behaviors:
  Gladiator:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 2000
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize_input: true
      hidden_units: 256
      num_layers: 2
      activation: tanh
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    checkpoint_interval: 50000
    max_steps: 1000000
    time_horizon: 1000
    summary_freq: 5000
    self_play:
      enabled: true
      save_steps: 50000
      team_change: 100000
      swap_steps: 2000
